name: Package and Release Review Crawler v2.0
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build ZIP
      shell: pwsh
      run: |
        $name = "TOURSTORY_Review_Crawler_v2.0"
        New-Item -ItemType Directory -Force "dist\$name" | Out-Null
        $items = @("INSTALL.cmd","START.cmd","main.py","README.md","VERSION.txt","requirements.txt","analysis","collectors","core","data","export","ui","tests")
        foreach ($i in $items) { Copy-Item $i "dist\$name\" -Recurse }
        Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0-build${{ github.run_number }}
        name: TOURSTORY Review Crawler v2.0 (build ${{ github.run_number }})
        body: |
          TOURSTORY_Review_Crawler_v2.0.zip 다운로드 → 압축 해제 → INSTALL.cmd (처음 1회) → START.cmd
          커밋: ${{ github.sha }}
        files: dist/TOURSTORY_Review_Crawler_v2.0.zip
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
